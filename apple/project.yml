name: dumbTV
options:
  bundleIdPrefix: app.dumbtv
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
    tvOS: "17.0"

packages:
  VLCKit:
    url: https://github.com/tylerjonesio/vlckit-spm.git
    branch: main
  dumbTVCore:
    path: dumbTVCore

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.3"
    CURRENT_PROJECT_VERSION: "1"
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_FILE: Info-shared.plist          # base for ATS; Xcode merges generated keys on top
    # dumbTV reaches the user's Plex server and serves its own setup page on the
    # LAN — iOS blocks local-network access without this usage string.
    INFOPLIST_KEY_NSLocalNetworkUsageDescription: "dumbTV connects to your Plex server and serves its setup page on your local network."
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGNING_ALLOWED: NO

# Shared by every platform app: copy the single source of the web config UI
# (public/) into the bundle's web/ folder, so the embedded server serves the
# same HTML/JS everywhere. No duplication in git — copied at build time.
targetTemplates:
  App:
    postBuildScripts:
      - name: Bundle web UI
        basedOnDependencyAnalysis: false
        script: |
          DEST="${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/web"
          mkdir -p "$DEST"
          cp "${SRCROOT}/../public/index.html" \
             "${SRCROOT}/../public/app.js" \
             "${SRCROOT}/../public/style.css" "$DEST/"

targets:
  dumbTV-iOS:
    type: application
    platform: iOS
    templates: [App]
    sources:
      - path: Sources
      - path: Resources
    dependencies:
      - package: VLCKit
        product: VLCKitSPM
      - package: dumbTVCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.dumbtv.ios
        PRODUCT_NAME: dumbTV
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"

  dumbTV-tvOS:
    type: application
    platform: tvOS
    templates: [App]
    sources:
      - path: Sources
      - path: Resources
    dependencies:
      - package: VLCKit
        product: VLCKitSPM
      - package: dumbTVCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.dumbtv.tvos
        PRODUCT_NAME: dumbTV
        ASSETCATALOG_COMPILER_APPICON_NAME: "App Icon & Top Shelf Image"

  dumbTV-macOS:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    templates: [App]
    sources:
      - path: Sources
      - path: Resources
    dependencies:
      - package: VLCKit
        product: VLCKitSPM
      - package: dumbTVCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.dumbtv.mac
        PRODUCT_NAME: dumbTV
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.entertainment
        CODE_SIGN_ENTITLEMENTS: dumbTV-macOS.entitlements
