name: dumbTV
options:
  bundleIdPrefix: app.dumbtv
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
    tvOS: "17.0"

packages:
  VLCKit:
    url: https://github.com/tylerjonesio/vlckit-spm.git
    branch: main
  dumbTVCore:
    path: dumbTVCore

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    GENERATE_INFOPLIST_FILE: YES
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGNING_ALLOWED: NO

targets:
  dumbTV-iOS:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
    dependencies:
      - package: VLCKit
        product: VLCKitSPM
      - package: dumbTVCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.dumbtv.ios
        PRODUCT_NAME: dumbTV
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"

  dumbTV-tvOS:
    type: application
    platform: tvOS
    sources:
      - path: Sources
      - path: Resources
    dependencies:
      - package: VLCKit
        product: VLCKitSPM
      - package: dumbTVCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.dumbtv.tvos
        PRODUCT_NAME: dumbTV

  dumbTV-macOS:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Sources
      - path: Resources
    dependencies:
      - package: VLCKit
        product: VLCKitSPM
      - package: dumbTVCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.dumbtv.mac
        PRODUCT_NAME: dumbTV
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.entertainment
