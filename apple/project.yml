name: dumbTV
options:
  bundleIdPrefix: app.dumbtv
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "16.0"
    tvOS: "17.0"

packages:
  VLCKit:
    url: https://github.com/tylerjonesio/vlckit-spm.git
    branch: main
  dumbTVCore:
    path: dumbTVCore

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.2.0"
    CURRENT_PROJECT_VERSION: "16"
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_FILE: Info-shared.plist          # base for ATS; Xcode merges generated keys on top
    # dumbTV reaches the user's Plex server and serves its own setup page on the
    # LAN — iOS blocks local-network access without this usage string.
    INFOPLIST_KEY_NSLocalNetworkUsageDescription: "dumbTV connects to your Plex server and serves its setup page on your local network."
    # Apple Developer team (dumbTV). Local dev builds stay unsigned
    # (CODE_SIGNING_ALLOWED: NO); build-release.sh overrides these to sign for
    # the App Store.
    DEVELOPMENT_TEAM: "B875CKJ7J5"
    CODE_SIGN_STYLE: Automatic
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGNING_ALLOWED: NO

# Shared by every platform app: copy the single source of the web config UI
# (public/) into the bundle's web/ folder, so the embedded server serves the
# same HTML/JS everywhere. No duplication in git — copied at build time.
targetTemplates:
  App:
    postBuildScripts:
      - name: Bundle web UI
        basedOnDependencyAnalysis: false
        script: |
          DEST="${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/web"
          mkdir -p "$DEST"
          cp "${SRCROOT}/../public/index.html" \
             "${SRCROOT}/../public/app.js" \
             "${SRCROOT}/../public/esc.js" \
             "${SRCROOT}/../public/style.css" "$DEST/"
      # Bundle preload content packs (Track I). A pack ships in the binary when
      # its source dir has a PRELOAD marker AND has been built (dist/pack.json).
      # Copied at build time so folder structure is preserved (no resource
      # flattening → no pack.json collisions). Not built yet? Skip gracefully.
      - name: Bundle content packs
        basedOnDependencyAnalysis: false
        script: |
          DEST="${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/packs"
          rm -rf "$DEST"; mkdir -p "$DEST"
          # The download catalog (fallback for the pack picker when dumbtv.app is unreachable).
          [ -f "${SRCROOT}/../packs/index.json" ] && cp "${SRCROOT}/../packs/index.json" "$DEST/"
          for marker in "${SRCROOT}/../packs"/*/PRELOAD; do
            [ -e "$marker" ] || continue
            pid="$(basename "$(dirname "$marker")")"
            src="${SRCROOT}/../packs/$pid/dist"
            if [ -f "$src/pack.json" ]; then
              mkdir -p "$DEST/$pid"
              cp "$src"/*.mp4 "$src/pack.json" "$DEST/$pid/" 2>/dev/null || true
              echo "note: bundled content pack '$pid'"
            else
              echo "warning: preload pack '$pid' not built (run: npm run build-pack build $pid) — skipping"
            fi
          done

targets:
  dumbTV-iOS:
    type: application
    platform: iOS
    templates: [App]
    sources:
      - path: Sources
      - path: Resources
    dependencies:
      - package: VLCKit
        product: VLCKitSPM
      - package: dumbTVCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.dumbtv.app
        PRODUCT_NAME: dumbTV
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        # iPad multitasking requires ALL FOUR orientations (App Store rejects a
        # universal build otherwise). iPhone key stays 3 (no upside-down).
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"

  dumbTV-tvOS:
    type: application
    platform: tvOS
    templates: [App]
    sources:
      - path: Sources
      - path: Resources
    dependencies:
      - package: VLCKit
        product: VLCKitSPM
      - package: dumbTVCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.dumbtv.app
        PRODUCT_NAME: dumbTV
        ASSETCATALOG_COMPILER_APPICON_NAME: "App Icon & Top Shelf Image"

  dumbTV-macOS:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    templates: [App]
    sources:
      - path: Sources
      - path: Resources
    dependencies:
      - package: VLCKit
        product: VLCKitSPM
      - package: dumbTVCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.dumbtv.app
        PRODUCT_NAME: dumbTV
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.entertainment
        CODE_SIGN_ENTITLEMENTS: dumbTV-macOS.entitlements
